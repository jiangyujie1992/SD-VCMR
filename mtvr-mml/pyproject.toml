[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtvr-mml"
version = "1.0.0"
description = "Anonymous feature-level implementation of Multi-modal Moment Localization"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["mtvr*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
